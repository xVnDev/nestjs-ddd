name: CodeQL scan
description: Initialize, build and analyze with CodeQL
inputs:
  language:
    description: CodeQL language to analyze
    required: false
    default: javascript-typescript
  build-mode:
    description: CodeQL build mode for the language
    required: false
    default: none
  queries:
    description: Additional CodeQL queries to run
    required: false
    default: +security-and-quality
runs:
  using: composite
  steps:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ inputs.language }}
        build-mode: ${{ inputs.build-mode }}
        queries: ${{ inputs.queries }}

    - name: Run manual build steps
      if: inputs.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ inputs.language }}"
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature. For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - master
      - dev
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Validate the generated SARIF file before attempting to upload it.
      # GitHub's code scanning API rejects uploads whose SARIF contains zero
      # runs ("1 item required; only 0 were supplied"), which happens when
      # Codacy produced no analyzable results. Skip the upload in that case
      # instead of failing the whole job.
      - name: Check and normalize SARIF results
        id: sarif_check
        run: |
          set -euo pipefail

          if [ ! -f results.sarif ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "has_runs=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Codacy did not generate results.sarif; skipping SARIF upload."
            exit 0
          fi

          python3 <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          source = Path("results.sarif")
          target = Path("normalized.sarif")

          with source.open("r", encoding="utf-8") as file:
              sarif = json.load(file)

          runs = sarif.get("runs") or []
          markdown_findings = 0

          def is_markdown_finding(result, artifacts=None):
              locations = result.get("locations") or []
              if not locations:
                  return False
              physical_location = locations[0].get("physicalLocation") or {}
              artifact_location = physical_location.get("artifactLocation") or {}
              uri = artifact_location.get("uri")
              if not uri:
                  # Resolve artifactLocation.index through the current run's
                  # artifacts when uri is absent before applying the filter.
                  index = artifact_location.get("index")
                  if index is not None and artifacts and 0 <= index < len(artifacts):
                      artifact = artifacts[index] or {}
                      artifact_loc = artifact.get("location") or {}
                      uri = artifact_loc.get("uri")
              uri = uri or ""
              path = unquote(urlparse(uri).path)
              return path.lower().endswith(".md")

          if not runs:
              target.unlink(missing_ok=True)
          else:
              # GitHub rejects multiple runs with the same category.
              # Keep one run and merge all remaining runs into it.
              merged = runs[0]
              merged_results = []
              for run in runs:
                  results = run.get("results") or []
                  artifacts = run.get("artifacts") or []
                  kept_results = [result for result in results if not is_markdown_finding(result, artifacts)]
                  markdown_findings += len(results) - len(kept_results)
                  merged_results.extend(kept_results)

                  if run is not merged:
                      for key in ("tool", "invocations", "artifacts", "automationDetails",
                                  "taxonomies", "translations", "properties"):
                          if key not in merged and key in run:
                              merged[key] = run[key]

              merged["results"] = merged_results
              sarif["runs"] = [merged]

              with target.open("w", encoding="utf-8") as file:
                  json.dump(sarif, file)

          print(f"Normalized {len(runs)} SARIF run(s) into 1 run")
          print(f"Filtered {markdown_findings} finding(s) from Markdown files")
          PY

          if [ ! -f normalized.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "has_runs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Codacy SARIF contains no runs; skipping GitHub code scanning upload."
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "has_runs=true" >> "$GITHUB_OUTPUT"

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        if: steps.sarif_check.outputs.has_runs == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: normalized.sarif
          category: codacy

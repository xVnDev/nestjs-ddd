name: Codacy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codacy-analysis:
    name: Codacy static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@6f415a0d3790c227a9cff580098545188e0f4e5a # master (pinned)
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: "sarif"
          format: "sarif"
          gh-code-scanning-compat: true
          max-allowed-issues: 0

name: Migration Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nestjs_ddd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nestjs_ddd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run migration:run
      - run: npm run typeorm -- migration:show
      - run: npm run test:e2e -- migration
      - name: Assert synchronize is disabled
        run: |
          if grep -R "synchronize: true" src/; then
            echo "synchronize must not be enabled";
            exit 1;
          fi
